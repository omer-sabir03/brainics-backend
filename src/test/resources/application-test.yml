spring:
  application:
    name: brainics-backend-test

  datasource:
    url: jdbc:tc:postgresql:///brainicstest
    driver-class-name: org.testcontainers.jdbc.ContainersDataSource

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 0

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    access-token-minutes: 15
  enquiry:
    rate-limit-per-hour: 5
    duplicate-check-hours: 24
    admin-notification-email: admin@test.brainics.com
  notification:
    async-enabled: false

resend:
  api-key: test-resend-key-12345
  from: test@brainics.local
  reply-to: reply@brainics.local

brainics:
  email:
    from: test@brainics.local
    reply-to: reply@brainics.local
  frontend-url: http://localhost:3000
