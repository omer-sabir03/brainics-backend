spring:
  application:
    name: brainics-backend

  # Lets you keep secrets in a local ".env" file (KEY=value lines) in the project root.
  # Real environment variables still work and take priority in production.
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Example: jdbc:postgresql://ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Small pool: Neon's free tier has limited connections.
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000   # Neon may need a few seconds to wake from sleep
      idle-timeout: 60000
      max-lifetime: 240000        # recycle connections before Neon suspends idle ones

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match the tables.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    # Comma-separated list of frontend origins allowed to call this API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  bootstrap-admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    frontend-url: ${BRAINICS_FRONTEND_URL:https://brainics.vercel.app/}
  enquiry:
    rate-limit-per-hour: ${ENQUIRY_RATE_LIMIT_HOUR:5}
    duplicate-check-hours: ${ENQUIRY_DUPLICATE_CHECK_HOURS:24}
    admin-notification-email: ${ADMIN_ENQUIRY_EMAIL}
  notification:
    async-enabled: true

resend:
  api-key: ${RESEND_API_KEY}
  from: ${BRAINICS_EMAIL_FROM}
  reply-to: ${BRAINICS_EMAIL_REPLY_TO:brainics@outlook.com}

brainics:
  email:
    from: ${BRAINICS_EMAIL_FROM}
    reply-to: ${BRAINICS_EMAIL_REPLY_TO:brainics@outlook.com}
  frontend-url: ${BRAINICS_FRONTEND_URL:https://brainics.vercel.app}


